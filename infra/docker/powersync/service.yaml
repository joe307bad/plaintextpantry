# yaml-language-server: $schema=https://unpkg.com/@powersync/service-schema@latest/json-schema/powersync-config.json
# PowerSync service config for local development.
# `!env NAME` substitutes container env vars; only PS_* names are allowed.

telemetry:
  disable_telemetry_sharing: true

replication:
  connections:
    - type: postgresql
      uri: !env PS_DATA_SOURCE_URI
      sslmode: disable

storage:
  type: postgresql
  uri: !env PS_STORAGE_SOURCE_URI
  sslmode: disable

port: !env PS_PORT

sync_config:
  path: sync-config.yaml

client_auth:
  # HS256 shared secret - development only. The F# server signs tokens with
  # the raw secret; this is its base64url encoding (see infra/docker/.env).
  jwks:
    keys:
      - kty: oct
        alg: HS256
        kid: powersync-dev
        k: !env PS_JWT_SECRET_B64
  audience: ["powersync-dev"]
