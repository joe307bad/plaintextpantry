name: plaintextpantry

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    # Logical replication is required for PowerSync to read the WAL.
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_APP_DB}
      PG_STORAGE_DB: ${PG_STORAGE_DB}
    ports:
      - "${PG_PORT}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_APP_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  powersync:
    image: journeyapps/powersync-service:latest
    restart: unless-stopped
    command: ["start", "-r", "unified"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POWERSYNC_CONFIG_PATH: /config/service.yaml
      # Only PS_* variables can be referenced with !env inside service.yaml.
      PS_DATA_SOURCE_URI: postgresql://${PG_USER}:${PG_PASSWORD}@postgres:5432/${PG_APP_DB}
      PS_STORAGE_SOURCE_URI: postgresql://${PG_USER}:${PG_PASSWORD}@postgres:5432/${PG_STORAGE_DB}
      PS_JWT_SECRET_B64: ${POWERSYNC_JWT_SECRET_B64}
      PS_PORT: ${PS_PORT}
    ports:
      - "${PS_PORT}:${PS_PORT}"
    volumes:
      - ./powersync:/config:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:${PS_PORT}/probes/liveness').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"
        ]
      interval: 5s
      timeout: 2s
      retries: 20
      start_period: 10s

  # Identity provider. Owns users and issues every token: the browser's login
  # session (via the F# server, OIDC) and MCP access tokens for Claude. Local
  # dev runs it in dev mode with a seeded password user; prod brokers Google.
  # The realm is provisioned by infra/keycloak/provision.sh (dev.sh runs it).
  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    restart: unless-stopped
    command: ["start-dev"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${PG_USER}
      KC_DB_PASSWORD: ${PG_PASSWORD}
      KC_HTTP_PORT: ${KC_PORT}
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      JAVA_OPTS_KC_HEAP: "-Xms64m -Xmx384m"
    volumes:
      # Login theme (dev mode doesn't cache themes, so edits show on reload).
      - ../keycloak/themes/plaintextpantry:/opt/keycloak/themes/plaintextpantry:ro
    ports:
      - "${KC_PORT}:${KC_PORT}"
    healthcheck:
      # Management port 9000. The image has no curl/wget; bash's /dev/tcp does.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '200 OK' <&3
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

volumes:
  pg_data:
