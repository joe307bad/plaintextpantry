# Production stack for the EC2 box. Deployed by deploy.sh, which writes .env
# from SSM Parameter Store and the values CI passes in.
#
# ./powersync and ./postgres are copied from infra/docker by the workflow when
# it assembles the bundle, so sync rules and the schema init script have one
# source of truth. Only Caddy is reachable from outside.
name: plaintextpantry

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    # wal_level=logical is required for PowerSync replication.
    # max_slot_wal_keep_size caps WAL retained per replication slot: a PowerSync
    # redeploy can orphan its old slot, and an uncapped dead slot pins WAL until
    # the disk fills (topspin hit 33GB this way).
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_slot_wal_keep_size=2GB
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_APP_DB}
      PG_STORAGE_DB: ${PG_STORAGE_DB}
    volumes:
      - /data/postgres:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_APP_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  powersync:
    image: journeyapps/powersync-service:latest
    restart: unless-stopped
    command: ["start", "-r", "unified"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POWERSYNC_CONFIG_PATH: /config/service.yaml
      PS_DATA_SOURCE_URI: postgresql://${PG_USER}:${PG_PASSWORD}@postgres:5432/${PG_APP_DB}
      PS_STORAGE_SOURCE_URI: postgresql://${PG_USER}:${PG_PASSWORD}@postgres:5432/${PG_STORAGE_DB}
      PS_JWT_SECRET_B64: ${POWERSYNC_JWT_SECRET_B64}
      PS_PORT: "8080"
      # Content hash of ./powersync (set by deploy.sh). Bind-mounted files
      # aren't part of what compose diffs, so this is what makes an edited
      # sync-config.yaml recreate the container.
      CONFIG_HASH: ${POWERSYNC_CONFIG_HASH}
    volumes:
      - ./powersync:/config:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8080/probes/liveness').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 2s
      retries: 20
      start_period: 15s

  # Identity provider at auth.<domain>. Brokers Google; owns the users; issues
  # the browser's login and MCP access tokens. Realm provisioned by
  # ./keycloak/provision.sh from deploy.sh.
  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    restart: unless-stopped
    # Plain `start` rebuilds Keycloak's optimized image on boot when KC_DB etc.
    # changed - a minute on this box, and it saves maintaining our own image.
    command: ["start"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${PG_USER}
      KC_DB_PASSWORD: ${PG_PASSWORD}
      # Every issuer/redirect URL Keycloak emits is built from this...
      KC_HOSTNAME: https://auth.${DOMAIN}
      # ...except backchannel ones (token, JWKS) when asked over the compose
      # network, so the F# server talks to keycloak:8080 directly instead of
      # looping out through the box's own public IP.
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # 2 GB box shared with Postgres, PowerSync and the API.
      JAVA_OPTS_KC_HEAP: "-Xms64m -Xmx384m"
      # Theme assets are served under a build-keyed path with a 30-day
      # max-age; an edited stylesheet would ship at an unchanged URL. Don't.
      KC_SPI_THEME_STATIC_MAX_AGE: "-1"
      # Content hash of ./keycloak (set by deploy.sh): a theme edit recreates
      # the container, which is also what empties its theme cache.
      CONFIG_HASH: ${KEYCLOAK_CONFIG_HASH}
    volumes:
      - ./keycloak/themes/plaintextpantry:/opt/keycloak/themes/plaintextpantry:ro
    healthcheck:
      # Management port 9000. The image has no curl/wget; bash's /dev/tcp does.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '200 OK' <&3
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s

  server:
    image: ${ECR_REGISTRY}/plaintextpantry/server:${IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      SERVER_URL: http://0.0.0.0:5050
      # Behind Caddy: trust X-Forwarded-Proto so redirect URIs and cookies are https.
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      APP_URL: https://${DOMAIN}
      KEYCLOAK_ISSUER: https://auth.${DOMAIN}/realms/plaintextpantry
      KEYCLOAK_METADATA_URL: http://keycloak:8080/realms/plaintextpantry
      KEYCLOAK_CLIENT_ID: plaintextpantry-web
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      MCP_RESOURCE: https://${DOMAIN}/mcp
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
      PG_APP_DB: ${PG_APP_DB}
      # Public URL the browser uses; Caddy strips the prefix.
      POWERSYNC_URL: https://${DOMAIN}/powersync
      POWERSYNC_JWT_SECRET: ${POWERSYNC_JWT_SECRET}
      DATA_PROTECTION_KEYS_DIR: /keys
    volumes:
      # Session-cookie keys. Without this they'd be inside the container and
      # every deploy would sign everyone out.
      - /data/server/keys:/keys

  web:
    image: ${ECR_REGISTRY}/plaintextpantry/web:${IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      - server
      - powersync
      - keycloak
    environment:
      DOMAIN: ${DOMAIN}
      CONFIG_HASH: ${CADDY_CONFIG_HASH} # same idea, for the Caddyfile
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Let's Encrypt certs and account keys; on the data volume so an
      # instance replacement doesn't hit LE rate limits re-issuing.
      - /data/caddy/data:/data
      - /data/caddy/config:/config
