# The Plaintext Pantry login theme. Mounted into the Keycloak container from
# infra/keycloak/themes; provision.sh sets it as the realm's loginTheme.
#
# parent=keycloak (not keycloak.v2): that name has existed in every release,
# and a parent that fails to resolve fails the whole theme. pantry.css is
# appended after the inherited styles, so everything in it is an override;
# a screen we've never styled still renders in the base skin.
parent=keycloak
import=common/keycloak

styles=css/login.css css/pantry.css
locales=en
meta=viewport==width=device-width,initial-scale=1
