<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover: when installed to a home screen the page runs
         under the iPhone home indicator; index.css pads the bottom row by
         env(safe-area-inset-bottom). maximum-scale / user-scalable turn off
         pinch zoom, which an app-like UI has no use for (index.css backs it
         up with touch-action, since iOS ignores this in a browser tab). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <title>Plaintext Pantry</title>
    <!-- Installable as a home-screen app. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Pantry" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <meta name="description" content="Local-first, open source, free, minimalist recipe and grocery list manager" />
    <!-- Link previews. One card for every route (this file serves them all); the
         image is public/brand/og.png, the wordmark and tagline at 2400x1260. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Plaintext Pantry" />
    <meta property="og:title" content="Plaintext Pantry" />
    <meta property="og:description" content="Local-first, open source, free, minimalist recipe and grocery list manager" />
    <meta property="og:image" content="https://plaintextpantry.com/brand/og.png" />
    <meta property="og:image:width" content="2400" />
    <meta property="og:image:height" content="1260" />
    <meta property="og:image:alt" content="Plaintext Pantry: local-first, open source, free, minimalist recipe and grocery list manager" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="/brand/icon.png" />
    <link rel="stylesheet" href="/index.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/fable-out/App.js"></script>
  </body>
</html>
